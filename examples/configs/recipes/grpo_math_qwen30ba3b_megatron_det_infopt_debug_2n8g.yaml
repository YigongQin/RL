# Qwen3-30B-A3B — inference-optimized + batch-invariant debug on 2 nodes.
# 1 train node (TP1 EP8) + 1 dedicated inference node (TP1 EP8). Tiny batches for iteration.
defaults: "grpo_math_qwen30ba3b_megatron_det_ep8tp1.yaml"

grpo:
  num_prompts_per_step: 2
  num_generations_per_prompt: 4

policy:
  train_global_batch_size: 8
  train_micro_batch_size: 1
  generation_batch_size: 4
  logprob_batch_size: 1
  max_total_sequence_length: 2048

  generation:
    colocated:
      enabled: false
      resources:
        gpus_per_node: 8
        num_nodes: 1
    mcore_generation_config:
      enable_chunked_prefill: false
      enable_prefix_caching: false

logger:
  wandb_enabled: false
  tensorboard_enabled: false

cluster:
  gpus_per_node: 8
  num_nodes: 2
