# Qwen2.5-1.5B — inference-optimized + batch-invariant debug on 1 node.
# Exercises the #3531 non-colocated path (dedicated gen Policy + refit) without 8 nodes.
# GPU split on one 8-GPU node: 4 train + 4 inference (policy_nodes=1 split in grpo.setup).
defaults: "../grpo_math_1B_megatron.yaml"

grpo:
  num_prompts_per_step: 4
  num_generations_per_prompt: 4

policy:
  model_name: "Qwen/Qwen2.5-1.5B"
  train_global_batch_size: 16
  train_micro_batch_size: 1
  generation_batch_size: 8
  logprob_batch_size: 4
  max_total_sequence_length: 512
  optimizer: null
  scheduler: null

  sequence_packing:
    enabled: false

  megatron_cfg:
    tensor_model_parallel_size: 1
    expert_model_parallel_size: 1
    sequence_parallel: false
    batch_invariant_mode: true
    batch_invariant_backend: te_native
    batch_invariant_collective: ordered
    attention_backend: flash
    flash_attention_version: 4
    env_vars:
      # Starve cuBLAS/cuBLASLt workspace before any GEMM (minf-onpolicy / te_native).
      CUBLAS_WORKSPACE_CONFIG: ":0:0"
      CUBLASLT_WORKSPACE_SIZE: "0"
      NRL_FUSED_TRAIN_LOGPROB: "1"
      NRL_REFIT_PARAM_SYNC: "1"

  generation:
    backend: "megatron"
    colocated:
      enabled: false
      resources:
        gpus_per_node: 4
        num_nodes: 1
    mcore_generation_config:
      transformer_impl: "inference_optimized"
      logprobs_mode: raw_logprobs
      tensor_model_parallel_size: 1
      expert_model_parallel_size: 1
      sequence_parallel: false
      inference_grouped_gemm_backend: "vllm"
      cuda_graph_impl: "local"
      inference_cuda_graph_scope: "block"
      enable_chunked_prefill: false
      refit_backend: "nvshmem"
      async_engine: true
      expose_http_server: true
      enable_prefix_caching: false

logger:
  wandb_enabled: false
  tensorboard_enabled: false

cluster:
  gpus_per_node: 8
  num_nodes: 1
